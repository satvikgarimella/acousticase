[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acousticase-backend"
version = "0.2.0"
description = "Experimental audio event investigation backend for Hack Western"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.12,<2", "soundfile>=0.12,<1",
  "av>=13,<20", "matplotlib>=3.8,<4", "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1", "pydantic>=2.9,<3"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
classifier = ["tensorflow>=2.16,<3", "tf-keras>=2.16,<3", "requests>=2.31,<3"]
ml = ["tensorflow>=2.16,<3", "tf-keras>=2.16,<3", "requests>=2.31,<3", "scikit-learn>=1.5,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"acousticase" = ["detection_profile.json"]
"acousticase.vendor.yamnet" = ["*.csv", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
